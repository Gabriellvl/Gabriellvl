<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Van Langenhove — carrying a lamp through San Francisco, looking for honest builders</title>
  <desc id="desc">A raven perches on a blackthorn branch. Across the darkness, a raised hand holds a lit Greek oil lamp. Its amber light catches the raven's eye.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <radialGradient id="light">
      <stop stop-color="#FFB347" stop-opacity=".65"/>
      <stop offset=".16" stop-color="#FFB347" stop-opacity=".32"/>
      <stop offset=".46" stop-color="#FFB347" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye-glow">
      <stop stop-color="#ffda96" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feathers" x1=".1" x2="1" y1=".8" y2=".25" gradientUnits="objectBoundingBox">
      <stop stop-color="#090b0e"/><stop offset=".56" stop-color="#17191a"/><stop offset="1" stop-color="#39362e"/>
    </linearGradient>
    <linearGradient id="clay" x2=".1" y2="1">
      <stop stop-color="#ad7841"/><stop offset=".22" stop-color="#694525"/><stop offset=".57" stop-color="#4e321f"/><stop offset="1" stop-color="#221b16"/>
    </linearGradient>
    <linearGradient id="skin" x1=".2" y1="1" x2=".8" y2="0">
      <stop stop-color="#11100f"/><stop offset=".62" stop-color="#29221b"/><stop offset="1" stop-color="#6c5135"/>
    </linearGradient>
    <pattern id="grain" width="53" height="41" patternUnits="userSpaceOnUse">
      <path d="M2 5h.8m11 26h.7m18-17h1m13 20h.7M45 3h.65M9 16h.6" stroke="#eee4ce" stroke-opacity=".09" stroke-width=".8"/>
    </pattern>
    <g id="flame">
      <path d="M0 0c-8-2-12-9-9-17 2-6 6-9 7-15 1-5 0-9-1-13 10 9 14 18 12 25C15-13 12-3 3 0Z" fill="#ffb347"/>
      <path d="M0-1c-6-5-4-11-1-16 2-3 3-6 3-10 7 10 9 20 1 26Z" fill="#ffe4a2"/>
      <path d="M1-1c-3-4-2-7 1-12 3 5 3 9 1 12Z" fill="#fff9d2"/>
    </g>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 750; letter-spacing: 2.9px; fill: #fff; }
      .subtitle { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #ffc27a; }
      @media (max-width: 550px) {
        #wide-type { display: none; }
        #compact-type { display: inline; }
        #lamp-scene { transform: translate(-176px, 0px); }
        #raven { transform: translate(-12px, 0px); }
      }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" rx="16" fill="#000"/>
    <rect width="1200" height="300" fill="url(#grain)"/>
    <g fill="#c5c0ae" opacity=".48">
      <circle cx="43" cy="57" r=".9"/><circle cx="93" cy="93" r=".7"/><circle cx="147" cy="38" r=".7"/>
      <circle cx="281" cy="28" r="1.1"/><circle cx="326" cy="149" r=".8"/><circle cx="365" cy="59" r=".9"/>
      <circle cx="423" cy="129" r=".75"/><circle cx="459" cy="34" r=".8"/><circle cx="533" cy="85" r="1.15"/>
      <circle cx="566" cy="47" r=".7"/><circle cx="638" cy="25" r=".85"/><circle cx="815" cy="196" r=".75"/>
      <circle cx="914" cy="235" r=".9"/><circle cx="1084" cy="194" r=".7"/><circle cx="1124" cy="259" r=".8"/>
    </g>

    <g id="raven" stroke-linejoin="round" stroke-linecap="round">
      <!-- A forked branch, with the claws wrapped around its upper edge. -->
      <path d="M-8 272 59 250 110 234 171 224 219 219 256 208 284 184 275 196 261 211 306 206 342 194 316 208 275 215 229 228 172 233 117 243 75 260 41 271-8 289Z" fill="#151619" stroke="#62615b" stroke-width="1.3"/>
      <path d="m56 251 13-13 12-6m68-4 42-16 13-12m24 18 34-8 27-18m-199 60 28-10 46-8" fill="none" stroke="#56544e"/>
      <path d="m173 225 45-6 38-11 21-17m-36 29 32-7 33-6" fill="none" stroke="#aa906b" stroke-width="1.2"/>
      <g fill="#141414" stroke="#b7b5a6" stroke-width="1.6">
        <path d="m160 185-6 21 4 8-6 11-14 1-9 6 12-4 14 1 9-9 5 5 13 2 5 5-3-8-14-5-9-7 8-24Z"/>
        <path d="m188 178-4 22 8 10-3 10-10 2-6 6 9-4 10-1 5-10 8 5 12 1 4 5-2-8-13-2-10-7-6-9 6-18Z"/>
      </g>
      <!-- Folded wing and wedge-shaped tail. -->
      <path d="m45 235 37-49 42-65 24-27 29-18 16-17 19-12 21-3 16 3 11 8 6 10 14 4 22 8 16 12 5 9-17-6-22-4-19 1-6 13-4 16-10 13 2-10-11 18 1-9-13 23-2-6-18 26-15 14-21 7-14 1-16 9-15 1-20 11-19 13 8-17-30 23 11-18-20 15Z" fill="url(#feathers)" stroke="#e9e8e0" stroke-width="2.25"/>
      <path d="m196 62 20-10 18-2 15 5 10 9-14-4-16 1-12 7-14 13-15 5Z" fill="#62605a" opacity=".38"/>
      <path d="m245 70 19-6 19 6 21 10 17 14-25-11-26-5-15 2Z" fill="#33302b" stroke="#c4c0b2" stroke-width="1.2"/>
      <path d="m262 79 22 2 28 9m-43-18 6 1" fill="none" stroke="#a69a83"/>
      <path d="m250 65-11-5-12 1-13 8m34 3-6-3-7 1-5 3" fill="none" stroke="#e3ddca" stroke-width="1.5"/>
      <path d="m247 83 13-3-5 19-9 17 1-11-15 23 4-13-13 13" fill="#2a2926" stroke="#9d9a8e" stroke-width="1.1"/>
      <path d="m258 87-5 15-7 12m0 6-9 13m-7 6-8 15" fill="none" stroke="#f2c992" stroke-width="1.7"/>
      <path d="m84 198 30-53 28-35 29-18 23-6 16 4 10 11-7 19-17 21-27 25-32 21-40 21 19-18Z" fill="#191b1d" stroke="#c5c6c1" stroke-width="1.6"/>
      <path d="m153 118 17-13 19-5 14 3-12 15-14 9-16 4 16-15-25 10Z" fill="#3b3c3a" stroke="#a7a8a2" stroke-width="1"/>
      <g fill="none" stroke="#bcbbb3" stroke-width="1.12">
        <path d="m201 123-23 23-40 27-45 30m91-72-29 17-25 24-26 21m62-52-25 14-27 31m33-46-16 10-16 21"/>
        <path d="m192 154-24 22-26 14m15-3-23 15-16 5m-3-15-31 27-15 9m42-38-18 15"/>
      </g>
      <circle cx="240.7" cy="69.8" r="7" fill="url(#eye-glow)"/>
      <path d="m236.4 70.3 3.8-2.4 4.1 1.3-3.8 2.5Z" fill="#0c0c0c"/>
      <circle cx="241" cy="69.5" r="1.7" fill="#ffdd92"/>
      <g class="motion" opacity="0">
        <animate attributeName="opacity" dur="6.1s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.943;.957;.97;.984;1"/>
        <ellipse cx="241" cy="69.7" rx="7.6" ry="6.3" fill="#343330"/>
        <path d="m236.8 70.1 4.4.9 3.5-1.6" fill="none" stroke="#af9e80" stroke-width="1.1"/>
      </g>
    </g>

    <g id="lamp-scene" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="702" cy="124" rx="263" ry="172" fill="url(#light)" opacity=".7"/>
      <ellipse class="motion" cx="702" cy="124" rx="207" ry="151" fill="url(#light)" opacity=".23">
        <animate attributeName="opacity" values=".18;.37;.18" dur="5.8s" repeatCount="indefinite"/>
      </ellipse>
      <!-- An open palm under the foot of an Attic-style terracotta lamp. -->
      <path d="m490 301 42-42 24-26 14-14 9-11 8-9 9 1 6 8 16 2 24-4 18-8 12-9 5 1q4 3 0 9l-11 11-13 10-21 12-26 9-19 17-28 43Z" fill="url(#skin)" stroke="#a28d72" stroke-width="1.65"/>
      <path d="m570 221 9-17 1-13q1-8 7-5l4 7 3 14 12 8m-6-2 21 1 22-4 18-7 16-12q4-2 6 1 2 4-5 9l-15 11-22 9m-21 2 18-2 20-7 16-9q7-3 8 0 0 5-13 12l-18 9-19 5m-33-14-12 1-11 8m18 16-22 19" fill="none" stroke="#bea27b" stroke-width="1.4"/>
      <path d="m446 302 67-43 29-24 12-10 3 11 11 3 7 15-8 19-12 29Z" fill="#181918" stroke="#918d80" stroke-width="1.7"/>
      <path d="m460 299 58-35 31-27-17 24-39 39m25 0 27-27 19-30m-22 58 19-26" fill="none" stroke="#706b60" stroke-width="1.2"/>
      <!-- Ring handle, reservoir, filling hole and pinched wick spout. -->
      <path d="M579 162c-9-19-19-29-31-26-12 2-16 13-12 24 5 14 17 23 38 23l4-8c-17 0-28-6-33-16-3-7-1-13 5-14 7-2 14 5 19 19Z" fill="url(#clay)" stroke="#d5b17d" stroke-width="1.8"/>
      <path d="M601 193q17 4 38-2l1 9q-16 9-38 6l-7-4Z" fill="#463123" stroke="#cb9c64" stroke-width="1.4"/>
      <path d="M558 162q9-12 39-16 26-4 61 2 15 1 31-12l8-6q8-3 19 4l6 4q-8 6-20 10-13 5-24 23-16 24-45 28-32 5-55-7-16-8-20-30Z" fill="url(#clay)" stroke="#f1ce96" stroke-width="2.1"/>
      <path d="M559 160q13 8 47 9 35 1 59-6l30-19 25-7q-10-9-21-7l-14 11-26 8q-22-8-51-6-35 1-49 17Z" fill="#916337" stroke="#dfad6d" stroke-width="1.5"/>
      <ellipse cx="610" cy="153.4" rx="27" ry="6.8" fill="#b37f4d" stroke="#edc388" stroke-width="1.1" transform="rotate(-3 610 153.4)"/>
      <ellipse cx="610" cy="153.7" rx="17.8" ry="3.7" fill="#1f170f" stroke="#d7a76e" stroke-width="1"/>
      <path d="M565 172q47 17 99-2m-91 10q43 14 83-1" fill="none" stroke="#dfa869" stroke-width="1.15"/>
      <path d="m579 177 3 4 5-3 3 4 6-3 4 4 5-3 5 3 5-3 5 3 5-4 5 2 4-4 6 2 4-4" fill="none" stroke="#e9b778" stroke-width="1"/>
      <path d="M583 189q27 10 54 2m34-33 23-15m-1-8q10-5 19 0" fill="none" stroke="#ffdaa1" stroke-width="1.4"/>
      <path d="m699 133 6-10 4 1-3 9Z" fill="#271a12" stroke="#ffdc9e" stroke-width="1.2"/>
      <g transform="translate(706 126)">
        <use xlink:href="#flame" transform="scale(.94 .95)"/>
        <g class="motion" opacity=".85">
          <animateTransform attributeName="transform" type="scale" values=".98 .98;1 .93;.94 1.03;.98 .98" dur="2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".76;.94;.82;.76" dur="2.3s" repeatCount="indefinite"/>
          <use xlink:href="#flame"/>
        </g>
      </g>
    </g>

    <g text-anchor="end">
      <g id="wide-type">
        <text class="title" x="1153" y="73" font-size="31">GABRIEL VAN LANGENHOVE</text>
        <text class="subtitle" x="1153" y="124" font-size="23"><tspan x="1153">carrying a lamp through San Francisco,</tspan>
          <tspan x="1153" dy="31">looking for honest builders</tspan></text>
      </g>
      <g id="compact-type" display="none">
        <text class="title" font-size="41"><tspan x="1160" y="65">GABRIEL</tspan><tspan x="1160" y="111">VAN LANGENHOVE</tspan></text>
        <text class="subtitle" font-size="32"><tspan x="1160" y="173">carrying a lamp through</tspan>
          <tspan x="1160" dy="36">San Francisco, looking for</tspan>
          <tspan x="1160" dy="36">honest builders</tspan></text>
      </g>
    </g>
  </g>
</svg>
